[project]
name = "app"
version = "0.1.0"
description = "FastAPI backend for the starter"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.149.0",
  "httpx==0.28.1",
  "psycopg[binary]==3.3.6",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "sqlalchemy[asyncio]==2.1.5",
  "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["mypy==2.4.0"]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "migrations"]
plugins = ["pydantic.mypy"]
