# Deployed stack: what runs in every deployed environment (e.g. on Coolify).
#
# Locally, `docker compose up` also merges compose.override.yaml on top of this
# file automatically. A deploy platform that reads only this file never sees it.
#
# Variables like ${SERVICE_PASSWORD_POSTGRES:-app}:
#   - on Coolify: SERVICE_* are "magic" variables; Coolify generates a random
#     value once per environment and keeps it across deploys.
#   - locally: values come from your .env file, which compose.override.yaml
#     requires. The value after ":-" is only used by `mise run deploy:check`.

name: python-react-starter

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES:-app}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      # Postgres 18+ images store data under /var/lib/postgresql/<major>/docker
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./backend
      target: deploy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES:-app}:${SERVICE_PASSWORD_POSTGRES:-app}@postgres:5432/${POSTGRES_DB:-app}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # One JSON object per line, so a log service can parse them.
      LOG_FORMAT: json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
      target: deploy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: in Alpine, localhost resolves to IPv6 first, and nginx listens on IPv4.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
