# Web server for the deployed frontend container. Locally, the Vite dev server
# does the same /api forwarding (see vite.config.ts), so nginx only runs here.

# Access log: one JSON object per request on stdout, matching the backend's JSON
# logs so a log service can parse both. Requests from 127.0.0.1 (the container's
# own health check) are not logged.
log_format json escape=json
  '{"time":"$time_iso8601","method":"$request_method","path":"$request_uri",'
  '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time,'
  '"client":"$http_x_forwarded_for","user_agent":"$http_user_agent"}';
map $remote_addr $loggable {
  127.0.0.1 0;
  default 1;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  access_log /var/log/nginx/access.log json if=$loggable;

  # Docker's internal DNS. Looking up "backend" per request (via a variable)
  # means nginx keeps working when the backend container is recreated.
  resolver 127.0.0.11 valid=10s;
  set $backend http://backend:8000;

  # Forward API calls to the backend container. Same origin as the app, so no CORS.
  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # Vite puts hashed, never-changing files in /assets: cache them for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Everything else is the single-page app. Unknown paths fall back to
  # index.html so client-side routes (e.g. /settings) work on page refresh.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
